server:
  port: 9010

spring:
  application:
    name: macula-cloud-iam
  profiles:
    # 生产用 SPRING_PROFILES_ACTIVE 覆盖（dev/test/prod）
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      # P2-4: 配置中心——业务配置全部在 Nacos（MACULA5 namespace）
      # optional: Nacos 不可用时不阻断启动（本地无 Nacos 的极端场景）
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: MACULA5
        username: nacos
        password: nacos
        refresh-enabled: true

---
# 远程开发环境（profiles: dev）
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    nacos:
      config:
        server-addr: 10.94.108.55:8848
        username: maculav5
        #password: 请通过启动命令赋予密码
