# Macula Cloud 本地基础设施一键部署
#
# 用法（在 deploy/ 目录执行）：
#   docker compose up -d
# 首次启动 MySQL 会自动按文件名顺序导入 initdb 下的全部 SQL（utf8mb4）。
#
# 端口：MySQL 3306 / Nacos 8848(+9848 grpc) / Redis 6380(映射容器 6379)
#
# 注意：
# 1. Redis 映射 6380——宿主机 6379 已被其他项目占用；应用配置连 127.0.0.1:6380。
# 2. Nacos 数据保存在 named volume，重启用 docker compose down（不加 -v）不丢数据。
# 3. 连字符库名（macula-system 等）在 SQL 中必须用反引号包裹。

services:
  mysql:
    image: mysql:8.0.35
    container_name: macula-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - macula-mysql-data:/var/lib/mysql
      # 首次初始化按文件名序执行；前缀保证顺序
      # （tinyid 已于 P2-2 下线；xxl-job 已于 P2-1 下线，调度统一 snail-job）
      - ../macula-cloud-system/docs/macula-system-dump.sql:/docker-entrypoint-initdb.d/01-macula-system.sql:ro
      - ../macula-cloud-snailjob/docs/snail_job_mysql.sql:/docker-entrypoint-initdb.d/02-macula-snailjob.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: macula-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30

  # macula-cloud 专用 Redis（与宿主机其他项目隔离）；宿主 6380 -> 容器 6379
  redis:
    image: redis:7-alpine
    container_name: macula-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - macula-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  macula-mysql-data:
  macula-nacos-data:
  macula-redis-data:
